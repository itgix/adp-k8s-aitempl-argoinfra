{{- if .Values.externalSecretDocker.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecretDocker.name }}
  labels:
    app: {{ .Release.Name }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore

  target:
    name: {{ .Values.externalSecretDocker.name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ .Values.externalSecretDocker.remoteKey }}
        property: .dockerconfigjson
{{- end }}